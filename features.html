<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>功能清单 · 增长收敛版 v3.0</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="docs.css"><style>.feature-tools{display:flex;gap:12px;margin:24px 0}.feature-tools input{flex:1;padding:12px;border:1px solid #ddd5e7;border-radius:9px}.feature-tools select{padding:12px;border:1px solid #ddd5e7;border-radius:9px}td{font-size:13px;line-height:1.75;vertical-align:top}td:first-child{min-width:110px}td:nth-child(2){min-width:110px}td:nth-child(3){min-width:125px}thead{background:#f1eef8}.table-wrap{overflow:auto}@media(max-width:600px){.feature-tools{flex-wrap:wrap}.feature-tools input{min-width:160px}}</style></head><body><main class="doc"><small>湖北青年有家 / 增长收敛版 v3.0 / 产品功能清单</small><h1>每一次参与，都有下一步。</h1><p class="intro">拉新和分享裂变、日常轻参与、实物积分商场。后台v3.0已对齐，并按独立菜单列出。</p><nav><a href="start.html">交付入口 →</a><a href="index.html">小程序 →</a><a href="admin.html#/rewards">后台v3.0 →</a><a href="admin3-spec.html">后台功能与状态 →</a><a href="growth-spec.html">玩法、预算和状态说明 →</a><a href="features-before-growth.html">旧版功能清单 →</a></nav><div class="feature-tools"><input id="filter" aria-label="搜索功能" placeholder="搜索菜单或功能描述"><select id="group" aria-label="一级菜单"><option>全部</option><option>首页</option><option>安家福利站</option><option>推荐朋友</option><option>积分商场</option><option>我的</option><option>一期移除</option><option>积分商城（后台）</option><option>活动运营管理（后台）</option><option>拉新推荐（后台）</option></select></div><p id="count" class="muted small"></p><div class="table-wrap"><table><thead><tr><th>一级菜单</th><th>二级菜单</th><th>三级菜单</th><th>功能描述</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const rows=[["首页","品牌与找房","原有信息流","保留品牌轮播、搜索、五项金刚区和12套参考房型；不把楼盘成交营销改成首页主体。"],["首页","活动入口","签到邀友领好礼","原“新人安家”改为醒目紫色矮卡片；进入签到／推荐好友／新人礼三入口福利站。第二张轮播进入福利站，第三张进入实物商场。"],["安家福利站","每日轻任务","签到","在安家福利站签到，每个北京时间自然日2积分，重复点击不重复计奖；未登录弹出登录确认。"],["安家福利站","每日轻任务","答生活知识题","从安家福利站进入生活小知识；费用、交接、用电、押金、收纳与隐私六道题，每题独立插画；答错可重选，答对首题每天5积分。"],["安家福利站","每日轻任务","推荐朋友","推荐小程序本身，不只推荐具体房源；朋友是新用户且首次签到＋答题完成后，推荐人得30积分。"],["安家福利站","每日轻任务","推荐房源与成交","从房源／项目详情推荐；有效咨询核实20积分，线下签约录入后另得300积分，成交奖励由运营商承担。"],["安家福利站","三项入口","签到／推荐好友／新人礼","三项入口清晰分开，集中展示任务完成状态和积分去向；不是线下活动列表。"],["安家福利站","新人礼","80积分见面礼","首签到＋首答题后每人领取一次80积分；签到和答题积分另计，足够兑换入门手机支架，不要求邀请。"],["安家福利站","新人礼","已有豆包礼品","保留既有豆包流量卡详情与卡库领取，不放入以实体商品为主的新积分商场；原型卡号仍不代表真实权益。"],["推荐朋友","推荐中心","参与与成交分层","参与小程序30分；租房推荐有效咨询20分、成交300分；分开解释条件与收益，不要求新用户先成交。"],["推荐朋友","分享入口","多场景分享","福利站／新人礼、签到卡、知识题答对页、积分商场、商品详情、兑换成功页和房源／项目详情均可分享。"],["推荐朋友","分享方式","好友／群／海报／链接","普通邀请支持好友或群聊卡片、可下载海报和复制链接；HTML中说明原生微信分享未接入，提供朋友落地页预览。"],["推荐朋友","朋友落地页","注册与任务","称呼、手机号、隐私同意，拒绝推荐人自己及已有手机号；首次签到与答题分步展示，完成后更新30分奖励。独立展示朋友积分，不暴露推荐人余额。"],["推荐朋友","参与进度","注册／签到／答题／奖励","五条不同阶段样例，可点击只读进度；手机号脱敏，不展示朋友答题答案、地址及完整手机号。"],["推荐朋友","成交进度","后台录入联动","沿用此前运营方后台成交录入结果和积分快照；不新增签约、收款、合同、租赁审批重业务。"],["积分商场","商品列表","分类与可兑换","手机支架、帆布袋、马克杯、保温杯4种实体好礼，按全部／我能兑换／居家日用／桌面好物／出门随行筛选。"],["积分商场","商品详情","规格和兑换条件","独立商品场景图、积分价格、规格颜色、名额、库存、配送说明和售后；积分不足去赚积分，库存不足不可提交。"],["积分商场","确认兑换","数量和地址","选择收货地址、数量1—3、积分合计、运费、剩余积分和发货时间；勾选兑换授权后弹窗二次确认。"],["积分商场","兑换结果","扣分与订单","确认时再次校验余额、库存和限兑数，扣积分、扣库存、生成待发货订单和不可变收货地址快照。"],["积分商场","收货地址","列表／新增／编辑／删除","收货人、手机号、省份、城市、区县、详细地址、默认地址；详细地址必填校验；切换地址或删除均不修改历史订单。"],["积分商场","我的兑换","状态列表","待发货、已发货、已完成、售后中、已取消各有样例及不同操作；可按状态筛选。"],["积分商场","兑换详情","只读与取消","只读展示礼品、数量、积分、收货地址、进度；待发货可取消，积分和库存各返还一次。"],["积分商场","物流与收货","物流详情／确认收货","已发货显示承运方、示例运单和轨迹；确认收货弹窗后变为已完成，不用禁用编辑表单表达只读。"],["积分商场","售后","申请／撤销","已完成订单可反馈破损、错发、缺件；原因、描述、联系电话、最多3张照片；进入售后中，可撤销申请。"],["我的","顶部","我的积分／积分商场","顶部仅两块，福利中心更名积分商场；不再展示第三个大钱包入口。"],["我的","找房服务","收藏／咨询","保留已有找房收藏和咨询，不增加重租赁业务。"],["我的","活动与福利","任务／推荐／礼品","保留此分组，包含每日轻任务、推荐朋友、推荐进度、新人礼、我的兑换、收货地址；删除“我的活动”。"],["我的","账户服务","隐私／帮助","保留授权隐私，帮助页覆盖推荐积分、实物订单、房源咨询，带简洁问题反馈表。"],["我的","我的积分","明细／规则","积分余额、收支明细、去赚积分、去兑换、规则说明；不可提现或转让，不和资格、房源排序挂钩。"],["一期移除","非核心模块","线下活动／找房清单／上班路／共创","新增运营路线、找房清单、线下活动报名核验、内容与管家共创不在新入口出现；旧文件和历史记录不删除。已有通勤筛选和结果属于现有小程序，不作为新增长功能设计。"],["积分商城（后台）","礼品管理","列表与详情","关键词、状态、分页、导出；4款实物及草稿、兑完、下架样例，名称、图、分类、积分、库存、限兑；详情用只读文本。"],["积分商城（后台）","礼品管理","新建／编辑／上下架／补货","名称、简介、规格、颜色、独立列表图和详情图、积分、采购估价、初始库存、每人1—3件限额；下架后再编辑，上架库存校验，补货，草稿删除。"],["积分商城（后台）","兑换订单","列表／详情／履约地址","同前台5种状态样例；筛选、分页、导出，查看地址快照、礼品、数量、积分、配送、售后照片和处理记录，不额外建立地址簿管理。"],["积分商城（后台）","兑换订单","发货／取消／物流","待发货填快递与运单后二次确认；取消填原因并一次性返分及恢复库存；发货后不提供重复发货或取消入口，前台同步状态。"],["积分商城（后台）","兑换订单","售后处理","补寄、退还积分或不通过；填写处理人和说明，补寄填写运单，退积分不恢复破损商品库存，不通过恢复原状态。"],["积分商城（后台）","积分规则","奖励与发布","仅签到、答题、新人礼、推荐参与、有效咨询、线下成交6类；金额、日期和推荐人数上限可编辑，保存草稿后发布、停用、重新启用；前台同步计奖。"],["积分商城（后台）","积分规则","运营设置／变更记录","10万元预算、运营商承担成交奖励、包邮、3工作日发货、7天售后、2工作日响应为只读约定；不新增预算驾驶舱或自动预算冻结。"],["积分商城（后台）","积分明细","查询／详情／导出","按用户、事项、关联内容查询签到、答题、新人、推荐、兑换、返还及回收记录；只读详情，无任意手工加减积分。"],["活动运营管理（后台）","生活知识","题目列表／编辑／发布","6道前台题目和草稿、下架样例；卡片标题、类别、题干、2—5个选项、正确答案、解析、插画与配色；统一使用每日答题奖励。"],["活动运营管理（后台）","新人礼","积分礼与领取记录","80积分默认新人礼规则、编辑入口和领取记录；完成首次签到＋答题后领取，与推荐人奖励分开。"],["活动运营管理（后台）","新人礼","豆包流量卡／卡库／记录","使用豆包头像；展示、活动日期、权益说明编辑；卡号、批次、有效期、采购单价导入，去重与作废；领取、已使用、过期、退回状态保留。"],["活动运营管理（后台）","需求问卷","配置／发布／答卷结果","保留现有调查管理与数据：草稿、收集中、暂停、结束、编辑、结果、答卷分页、导出；已有答卷保留原题，不新增奖励。"],["拉新推荐（后台）","参与推荐","列表／详情／异常","记录小程序、签到、知识、积分商场和商品等分享来源；首签到＋首答题自动计奖，展示已注册、已参与、不计奖；异常核实填原因，已发积分回收与待追回登记。"],["拉新推荐（后台）","找房推荐","核实／成交／详情","房源和项目详情分享的5种阶段；首次有效咨询核实20分，安家乐寓线下签约即时录入300分，由运营商承担；不做合同、收款或租赁审批。"]];function draw(){let q=document.querySelector('#filter').value.trim(),g=document.querySelector('#group').value,items=rows.filter(r=>(g==='全部'||r[0]===g)&&r.join(' ').includes(q));document.querySelector('#rows').innerHTML=items.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');document.querySelector('#count').textContent='共 '+items.length+' 项';}document.querySelector('#filter').oninput=draw;document.querySelector('#group').onchange=draw;draw();</script></body></html>
